<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]{display:none!important}</style><meta name="description" content="MONK, a quiet daily practice: the morning Offering, the evening Examen, lectio, a prayer list, guided prayers and a journal, set as one book. Sample content."></head><body>
<title>MONK</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hanken+Grotesk:wght@400..700&family=Playwrite+DE+Grund:wght@100..400&display=swap">
<link rel="stylesheet" href="app/app.css?v=cd6dd9abba4b">
<div class="mk mk-paper" id="app">
  <div class="mk-app" id="stage">
  <div class="mk-shell" id="shell">
    <aside class="mk-rail" id="rail"></aside>
    <main class="mk-main has-spread" id="main">
      <div class="mk-top" id="top"></div>
      <section class="mk-place mk-spread" id="p-today"></section>
      <section class="mk-place mk-spread is-office" id="p-offering" hidden></section>
      <section class="mk-place mk-spread is-office" id="p-examen" hidden></section>
      <section class="mk-place mk-spread" id="p-devotional" hidden></section>
      <section class="mk-place mk-spread mk-rd" id="p-reading" hidden></section>
      <section class="mk-place mk-spread" id="p-prayer" hidden></section>
      <section class="mk-place mk-spread mk-gp" id="p-guided" hidden></section>
      <section class="mk-place mk-spread mk-jplace" id="p-journal" hidden></section>
      <section class="mk-place mk-spread" id="p-walk" hidden></section>
      <!-- Study and Praxis are hidden from the rail, not deleted: both still render here. -->
      <section class="mk-place mk-col" id="p-study" hidden></section>
      <section class="mk-place mk-col" id="p-praxis" hidden></section>
    </main>
    <nav class="mk-tabbar" id="tabbar" aria-label="Monk"></nav>
  </div>
  </div>
  <button class="mk-jscrim mk-scrim" id="jscrim" type="button" aria-label="Close the journal" data-act="journal" tabindex="-1"></button>
  <aside class="mk-drawer mk-jr" id="jdrawer" aria-label="Journal"></aside>
</div>
<template id="tpl-devotional"></template>
<template id="tpl-study-session"></template>
<script src="app/app.js?v=cd6dd9abba4b" charset="utf-8"></script>
</body></html>
